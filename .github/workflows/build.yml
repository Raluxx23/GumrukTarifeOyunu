name: Build iOS IPA
on: 
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI iOS Workload
        run: dotnet workload install maui-ios

      - name: Build iOS App (No Linker)
        run: |
          dotnet build -f net9.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:EnableCodeSigning=false -p:PublishTrimmed=false -p:RunAOTCompilation=false -p:MtouchLink=None -p:ValidateXcodeVersion=false -p:_SuppressXcodeVersionCheck=true

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          APP_PATH=$(find bin/Release/net9.0-ios/ios-arm64 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -type d | head -n 1)
          fi
          echo "Bulunan App Paketi: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r GumrukTarifeOyunu.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GumrukTarifeOyunu-IPA
          path: GumrukTarifeOyunu.ipa
