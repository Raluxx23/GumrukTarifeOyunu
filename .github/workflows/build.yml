name: Build iOS IPA
on: 
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Install MAUI Workload
        run: dotnet workload install maui

      - name: Build and Package iOS IPA
        run: |
          dotnet publish -f net8.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:ArchiveOnBuild=true -p:EnableCodeSigning=false -p:SupportedOSPlatformVersion=15.0 -p:TargetPlatformVersion=17.2 || dotnet publish -f net9.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:ArchiveOnBuild=true -p:EnableCodeSigning=false -p:SupportedOSPlatformVersion=15.0

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GumrukTarifeOyunu-IPA
          path: |
            **/bin/Release/**/publish/*.ipa
            **/bin/Release/**/publish/*.app
