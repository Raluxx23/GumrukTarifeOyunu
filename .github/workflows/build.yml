name: Build iOS IPA
on: 
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Workloads
        run: dotnet workload restore

      - name: Build and Package iOS App
        run: |
          dotnet publish -f net8.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:ArchiveOnBuild=true -p:EnableCodeSigning=false

      - name: Upload IPA / App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GumrukTarifeOyunu-iOS
          path: |
            **/bin/Release/net8.0-ios/ios-arm64/publish/*.ipa
            **/bin/Release/net8.0-ios/ios-arm64/publish/*.app
