name: Build iOS IPA
on: 
  push:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI iOS Workload
        run: dotnet workload install maui-ios

      - name: Build and Package IPA
        run: |
          dotnet publish -f net8.0-ios -c Release -p:RuntimeIdentifier=ios-arm64 -p:ArchiveOnBuild=true

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GumrukTarifeOyunu-IPA
          path: '**/bin/Release/net8.0-ios/ios-arm64/publish/*.ipa'
